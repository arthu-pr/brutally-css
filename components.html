<html lang="en">
  <head>
    <title>Brutally CSS - Components</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/main.css" rel="stylesheet" />
    <link href="css/layouts/wrapper.css" rel="stylesheet" />
    <link href="css/layouts/box.css" rel="stylesheet" />
    <!-- Base -->
    <link href="css/base/reset.css" rel="stylesheet" />
    <link href="css/base/helpers.css" rel="stylesheet" />
    <link href="css/base/colors.css" rel="stylesheet" />
    <link href="css/base/spacing.css" rel="stylesheet" />
    <link href="css/base/animations.css" rel="stylesheet" />
    <link href="css/base/variables.css" rel="stylesheet" />
    <!-- Utils -->
    <link href="css/utils/variables.css" rel="stylesheet" />
    <link href="css/utils.css" rel="stylesheet" />
    <link href="css/utils/screens.css" rel="stylesheet" />
    <link href="css/components/common.css" rel="stylesheet" />
    <link href="css/banner.css" rel="stylesheet" />
    <link href="css/utils/helpers.css" rel="stylesheet" />
    <!-- Atoms -->
    <link href="css/components/atoms/overlay.css" rel="stylesheet" />
    <link href="css/components/atoms/typography.css" rel="stylesheet" />
    <link href="css/components/atoms/input.css" rel="stylesheet" />
    <link href="css/components/atoms/buttons.css" rel="stylesheet" />
    <link href="css/components/atoms/code.css" rel="stylesheet" />
    <link href="css/components/atoms/link.css" rel="stylesheet" />
    <!-- Molecules -->
    <link href="css/components/molecules/form.css" rel="stylesheet" />
    <link href="css/components/molecules/shake.css" rel="stylesheet" />
    <link href="css/components/molecules/dynamic-form.css" rel="stylesheet" />
    <link href="css/components/molecules/list.css" rel="stylesheet" />
    <link href="css/components/molecules/modal.css" rel="stylesheet" />
    <link href="css/components/molecules/section.css" rel="stylesheet" />
    <link href="css/components/molecules/navbar.css" rel="stylesheet" />
    <!-- Organisms -->
    <link href="css/components/organisms/grid.css" rel="stylesheet" />
    <link
      href="css/components/organisms/how-does-it-work.css"
      rel="stylesheet"
    />
    <link href="css/components/organisms/theme-bar.css" rel="stylesheet" />
    <link href="css/components/organisms/info-section.css" rel="stylesheet" />
    <!-- Animations -->
    <link href="css/animations/highlighted.css" rel="stylesheet" />
    <link href="css/animations/vertical.css" rel="stylesheet" />
    <link href="css/animations/modifier.css" rel="stylesheet" />
    <!-- Main theme -->
    <link href="css/theme.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

  <body>
    <div class="wrapper h-full">
      <div class="container padding-y-md">
        <h1 class="-highlighted"><span class="labeled">Components</span></h1>
        <h2>Atoms</h2>

        <!-- Button -->
        <section class="box">
          <p aria-label="box-title" ="text-xl">Button</p>
          <div class="flex gap-md flex-wrap">
            <button class="a-btn theme">Primary</button>
            <button data-component="secondary" class="a-btn theme">
              Secondary
            </button>
            <button class="a-btn theme -raw">Raw</button>
            <button data-component="secondary" class="a-btn theme -raw">
              Raw
            </button>
            <button
              data-component="secondary"
              class="a-btn theme -raw"
              disabled
            >
              Disabled
            </button>
          </div>
        </section>

        <!-- Input -->
        <section class="box">
          <p aria-label="box-title" ="text-xl">Text Input</p>
          <div class="flex gap-md flex-wrap">
            <input type="text" class="a-input theme" placeholder="Primary" />
            <input
              type="text"
              class="a-input theme secondary"
              placeholder="Secondary"
            />
            <input type="text" class="a-input theme -raw" placeholder="Raw" />
            <input
              type="text"
              class="a-input theme secondary -raw"
              placeholder="Raw Secondary"
            />
            <input
              type="text"
              class="a-input theme -raw"
              disabled
              placeholder="Disabled"
            />
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
