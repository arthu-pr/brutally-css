name: Consume Design Tokens

on:
  workflow_dispatch:
    inputs:
      tokens_repo:
        description: 'Source tokens repository'
        required: true
        type: string

jobs:
  update-tokens:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up directories
        run: |
          mkdir -p tokens brutallycss
          ls -la

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: brutallycss

      - name: Checkout tokens repository
        uses: actions/checkout@v4
        with:
          repository: arthur-plazanet/unholy-design-tokens
          ref: main
          path: tokens

      - name: Copy tokens to project
        run: |

          # Copy all CSS files from the dist branch
          cp -r tokens/src/build/css/ brutallycss

          # Show what was copied
          echo "Copied tokens:"
          ls -la tokens/src/build/css/
          ls -la brutallycss/
          ls -la brutallycss/css/

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            DATE: $(date -u +"%Y-%m-%d")
            echo "Date: ${DATE}"
          branch: tokens/update-${DATE}
          delete-branch: true
          title: 'Update design tokens ${DATE}'
          body: |
            ## Design Tokens Update

            This PR updates the design tokens from the tokens repository.

            **Details:**
            # - 📦 Version: `${{ inputs.token_version }}`
            - 🔗 Source: [arthur-plazanet/unholy-design-tokens](https://github.com/arthur-plazanet/unholy-design-tokens)
            # - 📍 Branch: `${{ inputs.tokens_branch }}`
            # - 🔑 Commit: [`${{ inputs.tokens_sha }}`](https://github.com/${{ inputs.tokens_repo }}/commit/${{ inputs.tokens_sha }})
            # - 🕐 Built: ${{ inputs.build_timestamp }}

            ### Changed Files
            This PR includes updates to design token CSS files in `tokens/src/build/css/`.

            ---
            🤖 *This PR was automatically generated by the token distribution workflow.*
          labels: |
            design-tokens
            automated
          assignees: ${{ github.actor }}

      - name: Output result
        run: echo "No token updates needed - tokens are already up to date"
