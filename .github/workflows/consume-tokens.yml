name: Consume Design Tokens

on:
  workflow_dispatch:
    inputs:
      tokens_repo:
        description: 'Source tokens repository'
        required: true
        type: string
      tokens_branch:
        description: 'Branch with built tokens (e.g., dist)'
        required: true
        type: string
      tokens_sha:
        description: 'Source commit SHA'
        required: true
        type: string
      build_timestamp:
        description: 'Build timestamp'
        required: true
        type: string
      token_version:
        description: 'Token version'
        required: true
        type: string

jobs:
  update-tokens:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tokens from dist branch
        run: |
          echo "Downloading tokens from ${{ inputs.tokens_repo }}@${{ inputs.tokens_branch }}"
          git clone --depth 1 --branch ${{ inputs.tokens_branch }} \
            https://github.com/${{ inputs.tokens_repo }}.git \
            /tmp/tokens

      - name: Copy tokens to project
        run: |
          # Create tokens directory if it doesn't exist
          mkdir -p src/styles/tokens

          # Copy all CSS files from the dist branch
          cp -r /tmp/tokens/css/* src/styles/tokens/

          # Show what was copied
          echo "Copied tokens:"
          ls -la src/styles/tokens/

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Update design tokens to v${{ inputs.token_version }}

            Source: ${{ inputs.tokens_repo }}@${{ inputs.tokens_sha }}
            Build: ${{ inputs.build_timestamp }}
          branch: tokens/update-${{ inputs.token_version }}
          delete-branch: true
          title: 'Update design tokens to v${{ inputs.token_version }}'
          body: |
            ## Design Tokens Update

            This PR updates the design tokens from the tokens repository.

            **Details:**
            - 📦 Version: `${{ inputs.token_version }}`
            - 🔗 Source: [`${{ inputs.tokens_repo }}`](https://github.com/${{ inputs.tokens_repo }})
            - 📍 Branch: `${{ inputs.tokens_branch }}`
            - 🔑 Commit: [`${{ inputs.tokens_sha }}`](https://github.com/${{ inputs.tokens_repo }}/commit/${{ inputs.tokens_sha }})
            - 🕐 Built: ${{ inputs.build_timestamp }}

            ### Changed Files
            This PR includes updates to design token CSS files in `src/styles/tokens/`.

            ---
            🤖 *This PR was automatically generated by the token distribution workflow.*
          labels: |
            design-tokens
            automated
          assignees: ${{ github.actor }}

      - name: Output result
        if: steps.check-changes.outputs.changed == 'false'
        run: echo "No token updates needed - tokens are already up to date"
