name: Check Design Tokens and Create PR
on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  check-design-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Set up directories
        run: |
          mkdir -p tokens brutallycss
          ls -la

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: brutallycss

      - name: Checkout tokens repository
        uses: actions/checkout@v4
        with:
          repository: arthur-plazanet/unholy-design-tokens
          ref: main
          path: tokens

      - name: Copy tokens to project
        run: |
          # TODO: when merged in main, use the build output
          # cd tokens
          # npx build-tokens brutallycss/build
          # Copy all CSS files from the dist branch
          rsync -a --delete --dry-run tokens/tokens/css/ brutallycss/tokens/css/

          # Show what was copied
          echo "Copied tokens:"
          ls -la tokens/tokens/css/
          ls -la brutallycss/
          ls -la brutallycss/css/

      - name: Check for changes
        id: check-changes
        run: |
          cd brutallycss
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi
      - name: Set formatted date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          path: brutallycss
          commit-message: |
            Date: ${{ env.DATE }}
          branch: tokens/update-${{ env.DATE }}
          delete-branch: true
          title: 'Update design tokens ${{ env.DATE }}'
          body: |
            ## Design Tokens Update

            This PR updates the design tokens from the tokens repository.

            **Details:**
            # - 📦 Version: `${{ inputs.token_version }}`
            - 🔗 Source: [arthur-plazanet/unholy-design-tokens](https://github.com/arthur-plazanet/unholy-design-tokens)
            # - 📍 Branch: `${{ inputs.tokens_branch }}`
            # - 🔑 Commit: [`${{ inputs.tokens_sha }}`](https://github.com/${{ inputs.tokens_repo }}/commit/${{ inputs.tokens_sha }})
            # - 🕐 Built: ${{ inputs.build_timestamp }}

            ### Changed Files
            This PR includes updates to design token CSS files in `tokens/src/tokens/css/`.

            ---
            🤖 *This PR was automatically generated by the token distribution workflow.*
          labels: |
            design-tokens
            automated
          assignees: ${{ github.actor }}

      - name: Output result
        run: echo "No token updates needed - tokens are already up to date"
