name: CI
on:
  # temporary disable workflows

  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: brutallycss

      - name: Install clean-css
        run: npm install -g clean-css-cli

      - name: Build and minify CSS
        run: cleancss -o brutallycss/dist/main.min.css brutallycss/css/**/*.css --remove-inlined-files

      - name: Install html-minifier
        run: npm install -g html-minifier

      - name: Minify HTML files
        run: |
          for file in brutallycss/*.html; do
            html-minifier \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes  \
              --remove-script-type-attributes  \
              --remove-tag-whitespace  \
              --use-short-doctype  \
              --minify-css true \
              -o "$file" "$file" 
            mv "$file" brutallycss/dist/"$(basename "$file")"
          done

      - name: Debug
        run: |
          ls -la brutallycss/dist
          ls -la brutallycss/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: brutallycss-dist
          path: brutallycss

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [minify]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: brutallycss-dist
          path: brutallycss

      - name: Debug
        run: ls -la brutallycss

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: unnecessary

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy build with rsync
        run: rsync -avz ./brutallycss/dist/* ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/brutallycss.com/
