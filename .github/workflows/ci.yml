name: Minify & Deploy & Check Design Tokens
on:
  # temporary disable workflows

  push:
    branches:
      - main

jobs:
  minify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: brutallycss

      - name: Install clean-css
        run: npm install -g clean-css-cli

      - name: Build and minify CSS
        run: cleancss -o brutallycss/dist/main.min.css brutallycss/css/**/*.css --remove-inlined-files

      - name: Install html-minifier
        run: npm install -g html-minifier

      - name: Minify HTML files
        run: |
          for file in brutallycss/*.html; do
            html-minifier \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes  \
              --remove-script-type-attributes  \
              --remove-tag-whitespace  \
              --use-short-doctype  \
              --minify-css true \
              -o "$file" "$file" 
          done

      - name: Debug
        run: ls -la brutallycss/dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: brutallycss-dist

  check-design-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Set up directories
        run: |
          mkdir -p tokens brutallycss
          ls -la

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: brutallycss

      - name: Checkout tokens repository
        uses: actions/checkout@v4
        with:
          repository: arthur-plazanet/unholy-design-tokens
          ref: main
          path: tokens

      - name: Copy tokens to project
        run: |

          # Copy all CSS files from the dist branch
          cp -r tokens/build/css/ brutallycss

          # Show what was copied
          echo "Copied tokens:"
          ls -la tokens/build/css/
          ls -la brutallycss/
          ls -la brutallycss/css/

      - name: Check for changes
        id: check-changes
        run: |
          cd brutallycss
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Set formatted date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            "Date: ${{ env.DATE }}"
          branch: tokens/update-${{ env.DATE }}
          delete-branch: true
          title: 'Update design tokens ${{ env.DATE }}'
          body: |
            ## Design Tokens Update

            This PR updates the design tokens from the tokens repository.

            **Details:**
            # - 📦 Version: `${{ inputs.token_version }}`
            - 🔗 Source: [arthur-plazanet/unholy-design-tokens](https://github.com/arthur-plazanet/unholy-design-tokens)
            # - 📍 Branch: `${{ inputs.tokens_branch }}`
            # - 🔑 Commit: [`${{ inputs.tokens_sha }}`](https://github.com/${{ inputs.tokens_repo }}/commit/${{ inputs.tokens_sha }})
            # - 🕐 Built: ${{ inputs.build_timestamp }}

            ### Changed Files
            This PR includes updates to design token CSS files in `tokens/src/build/css/`.

            ---
            🤖 *This PR was automatically generated by the token distribution workflow.*
          labels: |
            design-tokens
            automated
          assignees: ${{ github.actor }}

      - name: Output result
        run: echo "No token updates needed - tokens are already up to date"

  deploy:
    runs-on: ubuntu-latest
    needs: [minify, check-design-tokens]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: brutallycss-dist

      - name: Debug
        run: ls -la brutallycss-dist
